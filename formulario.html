<!DOCTYPE html>
<html lang="es">
<form id="formRegistro">
<label for="nombre">Nombre:</label>
    <input
        type="text"
        id="nombre"
        name="nombre"
    >

    <label for="correo">Correo:</label>
    <input
        type="email"
        id="correo"
        name="correo"
    >
<label for="contrasena">Contrasena:</label>
    <input
        type="password"
        id="contrasena"
        name="contrasena"
    >

    <label for="edad">Edad:</label>
    <input
        type="number"
        id="edad"
        name="edad"
	min="18"
   	 max="100"
    	required
    >
<label for="Fecha de nacimiento">Fecha de Nacimiento:</label>
    <input
        type="date"
        id="Fecha de nacimiento"
        name="Fecha de nacimiento"
    >

	<label for="genero">Genero:</label>
	<input
   	type="radio"
    	id="masculino"
   	name="genero"
    	value="masculino"
	>
	<label for="masculino">
    	Masculino
	</label>

	<input 
	type="radio"
    	id="femenino"
   	name="genero"
    	value="femenino"
	>
	<label for="femenino">
   	 Femenino
	</label>
   
<label for="juegos">Videojuegos que te gusten de aqui:</label>
	<input
    type="checkbox"
    id="hlf2"
    name="juegos"
    value="hlf2"
>

<label for="hlf2">
    Half Life 2
</label>

<input
    type="checkbox"
    id="pz"
    name="juegos"
    value="pz"
>

<label for="pz">
    Project Zomboid
</label>

<input
    type="checkbox"
    id="mc"
    name="juegos"
    value="mc"
>

<label for="mc">
    Minecraft
</label>


<label for="color_favorito">Color de fondo preferido:</label>
	<input type="color"
 	id="color_favorito" 
	name="color_favorito" 
	>

  <label for="satisfacion">Nivel de Satifacion:</label>
    	<input type="range" 
	id="satisfacion" 
	name="satisfacion"
	min="0" max="100" step="10"
	required
	>
    <button type="submit">Registrar</button>

</form>
</html>
